<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Devora – Developer tools in your browser</title>
  <meta name="description"
    content="Devora is a collection of fast, focused developer utilities you can use directly in your browser." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Devora" />
  <meta property="og:title" content="Devora – Developer tools in your browser" />
  <meta property="og:description"
    content="Devora is a collection of fast, focused developer utilities you can use directly in your browser." />
  <meta name="twitter:card" content="summary" />
  <meta name="theme-color" content="#fbfbfd" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#07070b" media="(prefers-color-scheme: dark)" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="icon" href="/favicon.svg" />
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('devora-theme')
        var theme =
          stored === 'light' || stored === 'dark'
            ? stored
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        document.documentElement.setAttribute('data-theme', theme)
      } catch (e) { }
    })()
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
